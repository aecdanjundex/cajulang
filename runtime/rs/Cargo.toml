[package]
name = "caju-runtime"
version = "1.0.0"
edition = "2021"
description = "Runtime nativo da linguagem Caju"

[lib]
name = "caju"
path = "src/lib.rs"
crate-type = ["staticlib"]

[features]
dll = []
ffitest = []

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
debug = false
